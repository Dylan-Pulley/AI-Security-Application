<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>External Cybersecurity Analyzer</title>
<style>
  :root { --bg:#0b0f14; --card:#141a22; --line:#232c38; --text:#e6edf3; --muted:#8b98a8; --good:#3fb950; --bad:#f85149; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:64px 20px; }
  h1 { font-size:28px; margin:0 0 6px; }
  p.sub { color:var(--muted); margin:0 0 32px; }
  form { display:flex; gap:10px; }
  input { flex:1; padding:14px 16px; font-size:16px; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { padding:14px 22px; font-size:16px; font-weight:600; color:#000; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #out { margin-top:32px; display:none; }
  .status { display:flex; align-items:center; gap:10px; font-size:20px; font-weight:600; margin-bottom:16px; }
  .dot { width:12px; height:12px; border-radius:50%; }
  .ok .dot { background:var(--good); } .bad .dot { background:var(--bad); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  .card .k { color:var(--muted); font-size:13px; }
  .card .v { font-size:18px; font-weight:600; margin-top:4px; word-break:break-all; }
  .problem { grid-column:1/-1; border-color:var(--bad); }
  pre { margin-top:24px; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:13px; overflow:auto; }
</style>
</head>
<body>
<main>
  <h1>External Cybersecurity Analyzer</h1>
  <p class="sub">Enter a site. We connect over TLS and tell you what we saw.</p>

  <form id="f">
    <input id="url" value="clark.edu" placeholder="example.com" autocomplete="off">
    <button id="go">Scan</button>
  </form>

  <section id="out">
    <div class="status" id="status"><span class="dot"></span><span id="host"></span></div>
    <div class="grid" id="cards"></div>
    <pre id="raw"></pre>
  </section>
</main>

<script>
const f = document.getElementById('f');
const out = document.getElementById('out');
const status = document.getElementById('status');
const cards = document.getElementById('cards');

function card(k, v, cls = '') {
  return `<div class="card ${cls}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
}

f.addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go');
  btn.disabled = true; btn.textContent = 'Scanning';

  const r = await fetch('/api/scan', {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify({url: document.getElementById('url').value.trim()})
  });
  const d = await r.json();

  document.getElementById('host').textContent = d.host;
  status.className = 'status ' + (d.ok ? 'ok' : 'bad');

  cards.innerHTML = d.ok
    ? card('Protocol', d.protocol) +
      card('Cipher', d.cipher) +
      card('Expires', d.expires) +
      card('Days left', d.days_left)
    : card('Problem', d.problem, 'problem');

  document.getElementById('raw').textContent = JSON.stringify(d, null, 2);
  out.style.display = 'block';
  btn.disabled = false; btn.textContent = 'Scan';
});
</script>
</body>
</html>
